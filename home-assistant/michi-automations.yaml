# 📄 Contenido para home-assistant/michi-automations.yaml

# 1️⃣ Automatización: Registrar la visita en base a lo que ve la IA
- alias: "Michi Health: Registrar Visita Arenero"
  id: michi_health_registrar_visita
  trigger:
    - platform: mqtt
      topic: double-take/matches/tapo_michi18  # <-- ¡CORREGIDO AQUÍ!
  condition:
    - condition: template
      value_template: "{{ trigger.payload_json.box.zone == 'zona_arenero' }}"
  action:
    - choose:
        # 🐈 Caso Dobby (Siamés Gris)
        - conditions:
            - condition: template
              value_template: "{{ trigger.payload_json.match.name == 'Dobby' and trigger.payload_json.match.score | float > 0.80 }}"
          sequence:
            - action: counter.increment
              target:
                entity_id: counter.michi_dobby_bano_counter

        # 🐈 Caso Patrón (Siamés Blanco/Negro)
        - conditions:
            - condition: template
              value_template: "{{ trigger.payload_json.match.name == 'Patron' and trigger.payload_json.match.score | float > 0.80 }}"
          sequence:
            - action: counter.increment
              target:
                entity_id: counter.michi_patron_bano_counter

# 2️⃣ Automatización: Reinicio diario a medianoche
- alias: "Michi Health: Reinicio Diario"
  id: michi_health_reinicio_diario
  trigger:
    - platform: time
      at: "00:00:00"
  action:
    - action: counter.reset
      target:
        entity_id:
          - counter.michi_dobby_bano_counter
          - counter.michi_patron_bano_counter

# 3️⃣ Automatización: Alertas Dinámicas de Salud
- alias: "Michi Health: Alertas de Salud por Rangos"
  id: michi_health_alertas_rangos
  trigger:
    - platform: numeric_state
      entity_id:
        - counter.michi_dobby_bano_counter
        - counter.michi_patron_bano_counter
      above: 6
    - platform: time
      at: "21:00:00"
  action:
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ trigger.platform == 'numeric_state' }}"
          sequence:
            - action: notify.persistent_notification
              data:
                title: "⚠️ Alerta Médica: Frecuencia Excesiva"
                message: >
                  El gato asociado al {{ trigger.to_state.name }} ha ido al baño más de 6 veces hoy (Total actual: {{ trigger.to_state.state }}). 
                  Podría sufrir cistitis o infección urinaria. Vigila su comportamiento.

        - conditions:
            - condition: template
              value_template: "{{ trigger.platform == 'time' }}"
          sequence:
            - repeat:
                for_each:
                  - entity: counter.michi_dobby_bano_counter
                    name: "Dobby"
                  - entity: counter.michi_patron_bano_counter
                    name: "Patrón"
                sequence:
                  - condition: template
                    value_template: "{{ states(repeat.item.entity) | int == 0 }}"
                  - action: notify.persistent_notification
                    data:
                      title: "⚠️ Alerta Médica: Inactividad"
                      message: "{{ repeat.item.name }} no ha registrado visitas al arenero en todo el día. Riesgo de obstrucción."