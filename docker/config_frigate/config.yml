mqtt:
  host: mosquitto
  port: 1883
  enabled: true

detectors:
  ov:
    type: openvino
    device: CPU

go2rtc:
  streams:
    tapo_michi18_high:
      - rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@{FRIGATE_CAM_IP}:554/stream1
    tapo_michi18_low:
      - rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@{FRIGATE_CAM_IP}:554/stream2

objects:
  track:
    - cat

cameras:
  tapo_michi18:
    enabled: true
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/tapo_michi18_low
          roles:
            - detect
        - path: rtsp://127.0.0.1:8554/tapo_michi18_high
          roles:
            - record
            - audio
  
    detect:
      width: 1280
      height: 720
      fps: 5

    audio:
      enabled: true

    onvif:
      host: "{FRIGATE_CAM_IP}"
      port: 2020
      user: "{FRIGATE_RTSP_USER}"
      password: "{FRIGATE_RTSP_PASSWORD}"

    record:
      enabled: true
      retain:
        days: 3
        mode: all
      events:
        retain:
          default: 14
          mode: active_objects

    snapshots:
      enabled: true
      retain:
        default: 7

    zones:
      zona_arenero:
        coordinates: 0.1,0.1,0.9,0.1,0.9,0.9,0.1,0.9