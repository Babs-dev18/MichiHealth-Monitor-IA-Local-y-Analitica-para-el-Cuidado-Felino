services:
  homeassistant:
    container_name: homeassistant
    image: "ghcr.io/home-assistant/home-assistant:stable"
    volumes:
      - /home/babs-dev18/infraestructura/domotica/config_ha:/config
      - /etc/localtime:/etc/localtime:ro
#    ports:
#      - "8123"
    restart: unless-stopped
    privileged: true
    network_mode: host

  # go2rtc.yaml
  go2rtc:
    image: alexxit/go2rtc:latest
    container_name: go2rtc
    restart: unless-stopped
    networks:
      - red-home-lab
    ports:
      - "1984:1984" # API y Web UI
      - "8554:8554" # Puerto RTSP que leerá Frigate
    devices:
      - /dev/video0:/dev/video0 # Solo go2rtc toca el hardware
    volumes:
      - ./go2rtc.yaml:/config/go2rtc.yaml # Archivo de configuración de go2rtc
      
  frigate:
    container_name: frigate
    image: ghcr.io/blakeblackshear/frigate:stable
    privileged: true
    restart: unless-stopped
    shm_size: "128mb"
    depends_on:
      - go2rtc # Espera a que go2rtc esté levantado antes de arrancar
    devices:
      - /dev/video0:/dev/video0 # Mapea capturadora
      - /dev/dri/renderD128:/dev/dri/renderD128 # Aceleración por hardware de Intel/AMD
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /home/babs-dev18/infraestructura/domotica/config_frigate:/config
      # CLIPS Y SNAPSHOTS
      - /mnt/datos/CCTV_cams/frigate_media:/media/frigate
    ports:
      - "5000:5000" # Web de Frigate
      # - "1984:1984" # 🚀 Web del go2rtc INCLUIDO dentro de Frigate
      # - "8554:8554" # RTSP de go2rtc incluido en Frigate
      - "8555:8555/tcp" # WebRTC
      - "8555:8555/udp" # WebRTC
    environment:
      - TZ=${TZ}
    networks:
      - red-home-lab # Le decimos a Frigate que use la red común

  compreface:
    container_name: compreface
    image: exadel/compreface:1.2.0
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - TZ=${TZ}
    networks:
      - red-home-lab # Enganchamos CompreFace a la red común

  double-take:
    container_name: double-take
    image: jakowenko/double-take:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./double-take:/storage
    environment:
      - TZ=${TZ}
    networks:
      - red-home-lab #  Enganchamos Double Take a la red común


# 🌐 Definimos las redes al final del archivo
networks:
  red-home-lab:
    external: true
